[project]
authors = [{name = "GofChianti maintainers"}]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "pandas>=1.3",
  "pooch>=1.6",
  "pyarrow>=10.0",
  "platformdirs>=2.5",
  "astropy>=5.0",
]
description = "Lightweight Python access to precomputed CHIANTI contribution functions G(ne, T)."
keywords = ["CHIANTI", "contribution function", "gofnt", "solar", "spectroscopy"]
license = {text = "MIT"}
name = "gofchianti"
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.0"

[project.scripts]
gofchianti-build-dataset = "gofchianti.cli:main"

[project.optional-dependencies]
# Only needed by maintainers who regenerate the dataset from IDL output.
maintainer = ["ChiantiPy>=0.15"]

[project.urls]
Homepage = "https://github.com/slimguat/GofChianti"
Repository = "https://github.com/slimguat/GofChianti"

[tool.poetry]
include = [{path = "src/gofchianti/data/**/*", format = ["sdist", "wheel"]}]
packages = [{include = "gofchianti", from = "src"}]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0"]

[dependency-groups]
dev = [
  "pytest (>=8.3)",
]
